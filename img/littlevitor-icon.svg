<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="purpleGrad" x1="55" y1="46" x2="100" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="145" y1="46" x2="100" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EE7C7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2F1F8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F2F1F8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- glow do ponto de encontro -->
  <circle cx="100" cy="150" r="30" fill="url(#sparkGlow)" filter="url(#softBlur)"/>

  <!-- as duas hastes formando o "V" -->
  <path d="M55 48 L100 150" fill="none" stroke="url(#purpleGrad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M145 48 L100 150" fill="none" stroke="url(#greenGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- ponto de luz onde as hastes se encontram -->
  <circle cx="100" cy="150" r="12" fill="#F8F7FC"/>
</svg>
