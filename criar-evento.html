<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar evento — Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
</head>

<body>

    <header class="site-header">
        <div class="wrap header-inner">
            <a href="index.html" class="logo">LittleVitor<span class="logo-dot">.com</span></a>
            <nav class="main-nav">
                <a href="painel.html">Meus eventos</a>
                <a href="index.html#eventos">Ver agenda</a>
            </nav>
            <a href="#" class="btn btn-ghost">Sair</a>
        </div>
    </header>

    <main>
        <div class="wrap">
            <a href="painel.html" class="back-link">&larr; Voltar pro painel</a>
        </div>

        <section class="form-page">
            <div class="wrap form-page-inner">

                <div class="section-head">
                    <h1>Criar evento</h1>
                    <p>Preencha os detalhes abaixo. Você pode editar tudo isso depois de publicar.</p>
                </div>

                <!-- em modo edição, o Python troca action/valores dos campos e o texto do botão -->
                <form class="evento-form" action="#" method="post" enctype="multipart/form-data " id="form-evento">

                    <!-- CAPA -->
                    <div class="form-group">
                        <label class="form-label">Imagem de capa</label>
                        <label class="upload-box" for="capa">
                            <input type="file" id="capa" name="capa" accept="image/*" onchange="mostrarPreview(this)">
                            <img id="preview-capa" class="upload-preview" alt="" hidden>
                            <div class="upload-placeholder" id="upload-placeholder">
                                <span class="upload-icon">+</span>
                                <span>Clique para enviar uma imagem</span>
                                <span class="upload-hint">JPG ou PNG · recomendado 1200×630px</span>
                            </div>
                        </label>
                    </div>

                    <!-- INFORMAÇÕES BÁSICAS -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="titulo">Nome do evento</label>
                            <input type="text" id="titulo" name="titulo" placeholder="Ex: Noite Eletrônica no Cais"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="categoria">Categoria</label>
                            <select id="categoria" name="categoria" required>
                                <option value="">Selecione</option>
                                <option value="musica">Música</option>
                                <option value="gastronomia">Gastronomia</option>
                                <option value="arte">Arte &amp; Cultura</option>
                                <option value="negocios">Negócios</option>
                                <option value="esporte">Esporte</option>
                                <option value="bem-estar">Bem-estar</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" rows="5"
                            placeholder="Conte pra quem for ver o evento o que esperar, line-up, atrações, etc."></textarea>
                    </div>

                    <!-- DATA E LOCAL -->
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="data">Data</label>
                            <input type="date" id="data" name="data" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="horario">Horário</label>
                            <input type="time" id="horario" name="horario" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="local">Local</label>
                            <input type="text" id="local" name="local" placeholder="Ex: Armazém 4 — Cais Mauá">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Ex: Porto Alegre — RS">
                        </div>
                    </div>

                    <!-- TIPOS DE INGRESSO -->
                    <div class="form-group">
                        <label class="form-label">Tipos de ingresso</label>

                        <div id="lista-ingressos" class="lista-ingressos">
                            <div class="ingresso-row">
                                <input type="text" name="ingresso_nome[]" placeholder="Nome (ex: Pista)" required>
                                <input type="number" name="ingresso_preco[]" placeholder="Preço" min="0" step="0.01"
                                    required>
                                <input type="number" name="ingresso_qtd[]" placeholder="Quantidade" min="1" required>
                                <button type="button" class="btn-remover" onclick="removerIngresso(this)"
                                    aria-label="Remover tipo de ingresso">&times;</button>
                            </div>
                        </div>

                        <button type="button" class="btn btn-outline btn-add" onclick="adicionarIngresso()">+ Adicionar
                            tipo de ingresso</button>
                    </div>

                    <!-- AÇÕES -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Publicar evento</button>
                        <button type="button" class="btn btn-ghost">Salvar rascunho</button>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <p>LittleVitor<span class="logo-dot">.com</span> — feito para conectar pessoas a experiências reais.</p>
            <p class="footer-meta">&copy; 2026 LittleVitor. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
 
 // Ao carregar a página, verifica se existe um rascunho salvo
// (isso acontece quando a pessoa foi mandada pro login/cadastro
// no meio do preenchimento do formulário).
const rascunhoSalvo = localStorage.getItem('rascunho_evento');

if (rascunhoSalvo) {
    const rascunho = JSON.parse(rascunhoSalvo);

    // Preenche cada campo do formulário com o valor salvo.
    document.getElementById('titulo').value = rascunho.titulo || '';
    document.getElementById('categoria').value = rascunho.categoria || '';
    document.getElementById('descricao').value = rascunho.descricao || '';
    document.getElementById('data').value = rascunho.data || '';
    document.getElementById('horario').value = rascunho.horario || '';
    document.getElementById('local').value = rascunho.local || '';
    document.getElementById('cidade').value = rascunho.cidade || '';
}

       // Pega o formulário de criação de evento
const formEvento = document.getElementById('form-evento');

formEvento.addEventListener('submit', (evento) => {
    // Impede o envio padrão por enquanto — vamos decidir manualmente
    // o que fazer, dependendo se tem usuário logado ou não.
    evento.preventDefault();

    // Verifica se existe um usuário logado
    const usuarioSalvo = localStorage.getItem('usuario');

    if (usuarioSalvo) {
        // Já está logado: por enquanto, só confirma no console.
        // (Na Parte 2, vamos publicar de verdade aqui.)
          alert('Evento publicado com sucesso!');

    // Limpa o rascunho, já que o evento foi "publicado"
    localStorage.removeItem('rascunho_evento');

    // Redireciona pro painel, onde o evento apareceria listado
    window.location.href = 'painel.html';
    } else {
        // Não está logado: precisamos salvar os dados do formulário
        // antes de mandar a pessoa pro login.

        // Monta um objeto com os dados dos campos principais.
        const rascunho = {
            titulo: document.getElementById('titulo').value,
            categoria: document.getElementById('categoria').value,
            descricao: document.getElementById('descricao').value,
            data: document.getElementById('data').value,
            horario: document.getElementById('horario').value,
            local: document.getElementById('local').value,
            cidade: document.getElementById('cidade').value
        };

        // Salva esse objeto no localStorage, como texto (JSON).
        localStorage.setItem('rascunho_evento', JSON.stringify(rascunho));

        // Redireciona pro login, informando pra onde voltar depois.
        window.location.href = 'login.html?retorno=criar-evento.html';
    }
});
       
       // Preview da imagem de capa
        function mostrarPreview(input) {
            const preview = document.getElementById('preview-capa');
            const placeholder = document.getElementById('upload-placeholder');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.hidden = false;
                    placeholder.hidden = true;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Adiciona uma nova linha de tipo de ingresso
        function adicionarIngresso() {
            const lista = document.getElementById('lista-ingressos');
            const linha = document.createElement('div');
            linha.className = 'ingresso-row';
            linha.innerHTML = `
        <input type="text" name="ingresso_nome[]" placeholder="Nome (ex: VIP)" required>
        <input type="number" name="ingresso_preco[]" placeholder="Preço" min="0" step="0.01" required>
        <input type="number" name="ingresso_qtd[]" placeholder="Quantidade" min="1" required>
        <button type="button" class="btn-remover" onclick="removerIngresso(this)" aria-label="Remover tipo de ingresso">&times;</button>
      `;
            lista.appendChild(linha);
        }

        // Remove uma linha de tipo de ingresso (mantém pelo menos uma)
        function removerIngresso(botao) {
            const lista = document.getElementById('lista-ingressos');
            if (lista.children.length > 1) {
                botao.closest('.ingresso-row').remove();
            }
        }
    </script>

</body>

</html>
