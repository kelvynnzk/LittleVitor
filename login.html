<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="wrap header-inner">
            <a href="index.html" class="logo">Agenda<span class="logo-dot">.</span></a>
            <nav class="main-nav">
                <a href="index.html#eventos">Eventos</a>
                <a href="index.html#categorias">Categorias</a>
                <a href="index.html#sobre">Sobre</a>
            </nav>
            <a href="criar-evento.html" class="btn btn-ghost">Criar evento</a>
        </div>
    </header>

    <main>
        <section class="auth-page">
            <div class="wrap auth-wrap">
                <div class="auth-card">
                    <h1>Entrar</h1>
                    <p class="auth-sub">Acesse sua conta para comprar ingressos ou gerenciar seus eventos.</p>

                    <!-- em caso de erro, o Python renderiza esta mensagem -->
                    <!-- <p class="auth-error">E-mail ou senha incorretos.</p> -->

                    <form class="auth-form" action="#" method="post">
                        <div class="form-group">
                            <label class="form-label" for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required autofocus>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                        </div>

                        <div class="auth-row">
                            <label class="checkbox-label">
                                <input type="checkbox" name="lembrar">
                                Manter conectado
                            </label>
                            <a href="#" class="auth-link">Esqueci minha senha</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                    </form>

                    <p class="auth-footer">
                        Ainda não tem conta? <a href="cadastro.html" class="auth-link">Criar conta</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <p>Agenda<span class="logo-dot">.</span> — feito para conectar pessoas a experiências reais.</p>
            <p class="footer-meta">&copy; 2026 Agenda. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>

</html>
